# Nextest configuration for roam-test

[profile.default]
# Fail fast - stop on first failure
fail-fast = true

# Status level
status-level = "pass"

# Slow test warning threshold
slow-timeout = { period = "2s", terminate-after = 2 }

[profile.ci]
# CI profile with longer timeouts
fail-fast = false
status-level = "pass"
slow-timeout = { period = "30s", terminate-after = 3 }

# Retry flaky tests in CI
retries = 2