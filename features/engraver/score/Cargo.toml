[package]
name = "engraver-score"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Notation score model + MusicXML importer for the engraver (full scores and parts)"

[dependencies]
musicxml = { workspace = true }
thiserror = { workspace = true }
# Format-level MusicXML decoding (.mxl unwrapping, entity decoding, the
# articulation/dynamics tag tables) shared with every other importer.
keyflow-musicxml = { workspace = true }
# layout + SVG rendering (P2): CPU-only engraver tier
engraver-proto = { workspace = true, features = ["svg"] }
kurbo = { workspace = true }
peniko = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The inventory test unzips a .mxl fixture directly, to cross-check the
# importer against the raw archive contents.
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
