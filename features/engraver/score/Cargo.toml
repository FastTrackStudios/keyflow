[package]
name = "engraver-score"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Notation score model + MusicXML importer for the engraver (full scores and parts)"

[features]
default = []
# Multi-page PDF export of a part (svg2pdf; not available on iOS).
pdf = ["engraver-proto/pdf"]

[dependencies]
musicxml = { workspace = true }
# Finale .musx: notes via its MusicXML converter, part layout from its
# linked-part records (`finale` module).
keyflow-musx = { workspace = true }
thiserror = { workspace = true }
# Format-level MusicXML decoding (.mxl unwrapping, entity decoding, the
# articulation/dynamics tag tables) shared with every other importer.
keyflow-musicxml = { workspace = true }
# layout + SVG rendering (P2): CPU-only engraver tier
engraver-proto = { workspace = true, features = ["svg"] }
kurbo = { workspace = true }
# Glyph advances for sizing text (rehearsal boxes, centred headers); the
# same skrifa engraver-proto already builds.
skrifa = "0.26"
peniko = { workspace = true }
# The section palette and vocabulary the master rhythm chart uses, for
# keyflow-style rehearsal markers.
keyflow-proto = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The inventory test unzips a .mxl fixture directly, to cross-check the
# importer against the raw archive contents.
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
