# Keyflow (features/extension/src/lib.rs): the chart editor as an
# Architect extension. One Rust value (`Keyflow`, a linked::Extension)
# runs it two ways: Architect and Studio link it in as a built-in, and its
# program (src/main.rs) serves the same value as a process, this
# manifest's [entry], when a development copy runs
# (EXT_CLONE {"id":"keyflow"}).
#
# A chart is a `.kf` document in the app's documents, which are CRDT
# replicas: an edit made through the host (`edit_document`) is one commit
# and one undo step that merges with everyone else's.
id = "keyflow"
name = "Keyflow"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "Chord charts and lead sheets: open a .kf chart and it is engraved in its pane, following the app's theme; zoom with Ctrl and the wheel, pan with the middle button."
authors = ["FastTrackStudios"]

[entry]
path = "keyflow-extension"

# EXT_CLONE writes this crate to the development folder and builds its
# program, which then overrides the linked copy under the same id.
[source]
git = "https://github.com/FastTrackStudios/keyflow"
rev = "main"
path = "features/extension"

# A chart in a session (pane state `session:<id>`) is read from the session
# this copy hosts. A chart alone needs no session.
# Keyflow is a session's first host: it provides `fts.session` to every
# extension (KEYFLOW_READ / _WRITE / _STRUCTURE, run as the caller), and
# its chart reads the sessions it holds directly.
[provides]
"fts.session" = "0.1.0"

# And uses it: KEYFLOW_SESSION_FOLLOW reads the session another provider
# answers for (the DAW engine's, studio#522, chosen with architect#872's
# EXT_SERVICE_USE), which the host allows only for a service named here.
# Providing and using one service together is valid since architect#873.
[uses]
"fts.session" = "^0.1"

# A session file (`.session`) is a document of the vault: the node opens it,
# syncs it through the org, and Keyflow edits the node's copy
# (KEYFLOW_SESSION_DOCUMENT).
[[doc_kinds]]
id = "fts.session"
name = "Session"
files = ["session"]
schema = 1

[capabilities]
effect = "mutating"
# A chart's text: read to engrave it, and written by note input (each
# operation one edit_document commit, one undo step).
reads = ["documents"]
writes = ["documents"]

[[actions]]
id = "KEYFLOW_STATE"
name = "Keyflow: open charts"
description = "Every chart open in a pane: its `path`, whether it parsed (`error` when not), its zoom (`null` fits the page to the width) and scroll ([x, y], logical pixels), what is selected on it (`selection`, the selectables' keys in reading order), the element under the pointer (`hover`) and its pane's frame times (`frames`: count, p50, p99, slowest); whether the charts are pinned `dark` or follow the app's theme (`follows_app_theme`), and the toolbar's tools that are on (`tools_on`)."
group = "Keyflow"
effect = "read_only"

[[actions]]
id = "KEYFLOW_CHART_VIEW"
name = "Keyflow: set the chart's view"
description = "Zooms and pans the open charts (`path`: only that one): `zoom` (1.0 is 100%, clamped to 0.25 to 4.0; `null` fits the page to the width), and `scrollX` / `scrollY` from the chart's top-left, in logical pixels."
group = "Keyflow"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"},"zoom":{"type":["number","null"]},"scrollX":{"type":"number"},"scrollY":{"type":"number"}}}'

[[actions]]
id = "KEYFLOW_SET_CHART_THEME"
name = "Keyflow: set the chart's theme"
description = "Draws the charts on dark paper (`dark: true`) or light, the default whatever the app's theme; `follow: true` draws them in the app's theme instead (its `chart.*` tokens, else its card, card ink and muted lines). Selection and hover are drawn in the theme's `chart.select` / `chart.hover`, else `primary` / `info`, either way."
group = "Keyflow"
effect = "mutating"
params = '{"type":"object","properties":{"dark":{"type":"boolean"},"follow":{"type":"boolean"}}}'

[[actions]]
id = "KEYFLOW_RELOAD"
name = "Keyflow: reload the chart"
description = "Reads the open charts (`path`: only that one) from their documents again and engraves them."
group = "Keyflow"
effect = "read_only"
params = '{"type":"object","properties":{"path":{"type":"string"}}}'

