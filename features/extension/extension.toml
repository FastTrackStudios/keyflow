description = "Note input by duration (M), or out of it: A–G or ↑ ↓ (a step) and Ctrl+↑ ↓ (an octave) move the pitch cursor, shown on the chart as the shadow note; a duration key (1–7) enters it."
group = "Keyflow"
effect = "mutating"
toggle = true

[[actions]]
id = "KEYFLOW_INPUT_SYNTAX"
name = "Keyflow: input via syntax"
description = "Keyflow's own syntax typed at the cursor (K), or out of it: type bars (`C / / / | Am7 / F G`) in the field under the chart and Enter writes them over the bars from the cursor on."
group = "Keyflow"
effect = "mutating"
toggle = true

