[[views]]
id = "chart"
title = "Chart"

# A .kf file is a document the app reads and edits (`read_document`,
# `edit_document`): without this the documents service serves only notes.
# Its body is text, not markdown.
[[file_types]]
extension = "kf"
name = "Keyflow chart"
icon = "music"
note_type = "keyflow-chart"
body = "text"

[[doc_kinds]]
id = "keyflow.chart"
name = "Keyflow chart"
files = ["kf"]
icon = "music"
view = "chart"

[[openers]]
id = "kf"
title = "Keyflow chart"
files = ["kf"]
view = "chart"

# A chart saved elsewhere (another person, another device, another
# extension) is read again.
[[hooks]]
on = "doc.saved"
action = "KEYFLOW_RELOAD"

# ── fts.session: Keyflow as a session's host (src/session_host.rs) ──────

[[actions]]
id = "KEYFLOW_READ"
name = "fts.session: read"
description = "fts.session's `read`: the calling extension's data, the timeline (other extensions' payloads null) or the song's structure. Args `{doc, request}`."
group = "Session"
effect = "read_only"
params = '{"type":"object","properties":{"doc":{"type":"string"},"request":{}},"required":["doc","request"]}'

[[actions]]
id = "KEYFLOW_WRITE"
name = "fts.session: write"
description = "fts.session's `write`: an edit to the calling extension's namespace, lanes or items. Args `{doc, request}`."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"doc":{"type":"string"},"request":{}},"required":["doc","request"]}'

[[actions]]
id = "KEYFLOW_STRUCTURE"
name = "fts.session: structure"
description = "fts.session's `structure`: the tempo map, markers or regions. Args `{doc, request}`."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"doc":{"type":"string"},"request":{}},"required":["doc","request"]}'

[[actions]]
id = "KEYFLOW_SESSION_OPEN"
name = "Session: open"
description = "Opens a `.session` file (`path`; when it is not there, made with the chart read from `chart_path`, or with `chart`, Keyflow source; either must read as a chart) and serves it as fts.session. Answers `{id, pane}`."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"},"chart":{"type":"string"},"chart_path":{"type":"string"}},"required":["path"]}'

[[actions]]
id = "KEYFLOW_SESSION_SERVE"
name = "Session: share with other app instances"
description = "Serves open session `id` (document sync, presence, the session clock) over vox on a WebSocket at `bind` (default 0.0.0.0:4142)."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"id":{"type":"string"},"bind":{"type":"string"}},"required":["id"]}'

[[actions]]
id = "KEYFLOW_SESSION_FOLLOW"
name = "Session: follow"
description = "Follows session `id` hosted elsewhere (the DAW engine's, another app's) at `url` (`ws://host:port/vox`): its transport and its host's clock, so the chart on `session:<id>` draws where it plays. Holds no copy and provides nothing: the chart is read and written through the host's fts.session. With `chart_path` (a .kf), the chart is written into the session when it holds none yet."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"url":{"type":"string"},"id":{"type":"string"},"chart_path":{"type":"string"}},"required":["url","id"]}'

[[actions]]
id = "KEYFLOW_SESSION_BAR_ONE"
name = "Session: the song's bar 1"
description = "Makes bar `bar` of session `id` (one this copy holds) the song's bar 1, where the chart's bar 1 is after a count-in (session bar_one); 1 or none: the session's start. A session the DAW engine holds is the engine's to set."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"id":{"type":"string"},"bar":{"type":"integer","minimum":1}},"required":["id"]}'

[[actions]]
id = "KEYFLOW_SESSION_DOCUMENT"
name = "Session: open a vault's session"
description = "Opens the session that is the vault document at `path` (a `.session` file of the vault): the node's copy, edited through the host and synced through the org like any document, served as fts.session. Keyflow holds no file and runs no host for it. Answers `{id, pane, path, writable}`."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"}},"required":["path"]}'

[[actions]]
id = "KEYFLOW_SESSION_JOIN"
name = "Session: join"
description = "Joins session `id` served at `url` (`ws://host:port/vox`), keeping it in `path`; serves it here as fts.session."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"url":{"type":"string"},"id":{"type":"string"},"path":{"type":"string"}},"required":["url","id","path"]}'

[[actions]]
id = "KEYFLOW_SESSION_PLAY"
name = "Session: publish the transport"
description = "Publishes the transport (`playing`, `position` seconds), stamped in the session's shared clock."
group = "Session"
effect = "mutating"
params = '{"type":"object","properties":{"playing":{"type":"boolean"},"position":{"type":"number"}}}'

[[actions]]
id = "KEYFLOW_SESSION_STATE"
name = "Session: state"
description = "Each open session's chart, the leader's transport, the followed playhead, the clock estimate and this process's clock epoch."
group = "Session"
effect = "read_only"

