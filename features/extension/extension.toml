extension = "kf"
name = "Keyflow chart"
icon = "music"
note_type = "keyflow-chart"
body = "text"

[[doc_kinds]]
id = "keyflow.chart"
name = "Keyflow chart"
files = ["kf"]
icon = "music"
view = "chart"

[[openers]]
id = "kf"
title = "Keyflow chart"
files = ["kf"]
view = "chart"

# A chart saved elsewhere (another person, another device, another
# extension) is read again.
[[hooks]]
on = "doc.saved"
action = "KEYFLOW_RELOAD"
