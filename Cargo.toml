# keyflow — one root workspace.
#
# Split out of FastTrackStudios/session (see docs/split/KEYFLOW.md there).
# The notation domain: the Keyflow chart language (parser, formats, live
# follow, LSP, tree-sitter grammar) and Engraver, its layout/render engine.
#
# Layer position: architect/vendor -> daw -> **keyflow** -> session ->
# signal -> FastTrackStudio. Intra-repo dependencies are path deps in the
# table below; cross-repo dependencies are git deps pinned to a tag.
#
# A crate is a domain, not a format: proto -> lang -> engraver -> keyflow,
# each old crate a module of one of those, its optional parts behind a
# Cargo feature of the module's name. See AGENTS.md "Layout".
#
# `daw` still carries its own copies of `keyflow-proto` and `keyflow-syntax`
# (`expression-editor-core`, which `daw-reaper` hard-depends on, builds
# against them). The copies here are the authority.

[workspace]
resolver = "3"

members = [
    "apps/cli",
    "features/keyflow",
    "features/lang",
    "features/proto",
    "features/annotate",
    "features/daw-analysis",
    "features/ui",
    "features/tree-sitter",
    "features/engraver",
    "features/editor",
]

[workspace.package]
# Tracks the release tag. Bump this with the tag.
version = "0.5.4"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/keyflow"

[workspace.dependencies]
# ── Internal — the notation domain, path declared ONCE here ───────────
# `keyflow` and `engraver` are the facades; `keyflow-lang` is the
# language crate beneath them, for formats the facade does not re-export.
# Defaults OFF at the root for all three: `keyflow-lang` and `engraver`
# default to every native feature (sync, lsp, pdf, …) so their own tests
# cover them, and the facade's default pulls `engraver` (wgpu + vello),
# which a wasm consumer does not want (it renders through vello_hybrid)
# and an iOS build cannot take (printpdf's azul dep does not build for
# iOS). Every consumer names the features it needs.
keyflow = { path = "features/keyflow", default-features = false }
keyflow-lang = { path = "features/lang", default-features = false }
keyflow-annotate = { path = "features/annotate" }
keyflow-daw-analysis = { path = "features/daw-analysis" }
# Defaults OFF at the root: keyflow-ui's default is `web`, which enables
# `dioxus/desktop` — and that drags dioxus-desktop -> tungstenite ->
# native-tls -> openssl-sys into a wasm32 build, where openssl does not
# compile. Consumers name the surface they want (`web` / `native` /
# `wasm-graphics`).
keyflow-ui = { path = "features/ui", default-features = false }
keyflow-cli = { path = "apps/cli" }
tree-sitter-keyflow = { path = "features/tree-sitter" }
engraver = { path = "features/engraver", default-features = false }

# ── editor — its own repo since the 2026-08 split ─────────────────────
# (FastTrackStudios/editor: document model, markdown pass, Dioxus view,
# vim, tree-sitter syntax, CRDT, LSP.) It sits BELOW this repo and depends
# on dioxus and crates.io only — that is what makes it embeddable.
#
# It already understands the ```kf fence family natively.
# `editor-keyflow` (here) implements its `fence_renderer` seam so charts
# engrave; editor-state knows nothing about keyflow, which is what keeps
# the graph acyclic.
# Not the markdown fences (Typst, Mermaid): nothing here renders them.
# Pinned at the revision architect v0.12.6 pins, on the `www.` host: its
# workspace-hack names `editor-view` there, so any other source or revision
# would be a second editor in the graph (and in studio's). Move with
# architect's pin.
editor-state = { git = "https://www.github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528", default-features = false }
editor-view = { git = "https://www.github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528", default-features = false }
editor-vim = { git = "https://www.github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528" }

# ── features/editor — this repo's half of the editor integration ──────
# It needs `editor-state` from below and `keyflow-lang`/`engraver` from
# here, so this is the only repo where it can live.
editor-keyflow = { path = "features/editor" }

# ── Cross-repo — tagged git deps ────────────────────────────────
# Defaults OFF at the root so lean consumers (probe-only scanners, the
# iOS-clean session-guide) don't drag the pack engine in; each consumer
# names the features it needs ("load" / "write" / "engine").
fts-sample = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.7", default-features = false }

# ── daw domain (wave 2) ───────────────────────────────────────────────
# Facade crate — the only public API surface for the daw domain.
# daw-proto, daw-control, daw-standalone, dawfile-* are INTERNAL to the
# domain; consumers outside it go through the `daw` facade.
daw = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.7" }
daw-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.7" }
daw-module = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.7" }
dawfile-reaper = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.7" }
keyflow-proto = { path = "features/proto" }

# ── Facet reflection + vox RPC — the rc.7 fleet ───────────────────────
# Caret, not `=`: the version is a FLOOR, and the lockfile holds the exact
# one. The fleet (task, session, keyflow, fasttrackstudio) moves together
# because a vox client and server on different rcs fail the handshake
# ("schema decode consumed N of M bytes"); the rc.7 floor is what keeps
# this repo from resolving an older one. An `=` pin made every consumer's
# graph unsolvable the moment one repo moved ahead of another.
facet = { version = "0.50.0-rc.7", features = ["reflect", "chrono", "uuid"] }
facet-json = { version = "0.50.0-rc.7" }
vox = { version = "0.10.0-rc.7", default-features = false, features = ["runtime"] }

# ── Architect framework — its own repo since the 2026-08 three-way split
# (FastTrackStudios/architect: the entity/RPC framework, the auth/crdt/
# permissions stack, architect-ui + architect-story, architect-telemetry).
#
# ONE revision shared by EVERY entry below — `architect` and
# `architect-ui`, and the [patch] table further down. They are one repo:
# a split revision checks that repo out twice, and cargo treats the two
# checkouts as different crates whose traits then refuse to unify.
#
# architect v0.12.6, by tag, on the `www.` spelling of the URL — ON PURPOSE.
# Cargo treats `https://www.github.com/…` as a different source from
# `https://github.com/…`, and that is what lets Studio take an Architect
# PATCH release without a keyflow release: Studio pins Architect on the
# plain URL and its `[patch."https://www.github.com/FastTrackStudios/architect"]`
# hands every crate named here (architect, architect-ui,
# architect-workspace) Studio's own tag. So in Studio's graph this tag is
# not used at all; here it is what keyflow's own CI builds and tests on.
#
# The limits (what still needs a keyflow release):
# - An Architect MINOR (v0.12 -> v0.13): it may break this repo's code, and
#   so far every minor moved the editor / dioxus / blitz revisions keyflow
#   follows (below). `just bump-architect vX.Y.0 --version …`, then
#   `just release-tag`. No patch release has (measured over 2026-10 to 2026-11).
# - A NEW direct Architect dependency of a keyflow crate: add it to
#   Studio's www `[patch]` table too, or Studio's lock gets a second
#   architect source (its `just bump-architect` refuses a lock with any
#   `www.github.com/FastTrackStudios/architect` source).
# Keep EVERY Architect entry here (and in features/ui) on the www spelling.
architect = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }

# The shared musical vocabulary — section colours and the canonical
# palettes `keyflow-proto` engraves section cards with.
music-catalog = { git = "https://github.com/FastTrackStudios/music-convention", tag = "v0.1.0" }
color-palette = { git = "https://github.com/FastTrackStudios/music-convention", tag = "v0.1.0" }
# The Dioxus primitive library (was libs/ui/fts-ui, renamed on the split).
# On the www spelling, like `architect` above (Studio's [patch] retargets it).
architect-ui = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
# ── MusicXML parsing (keyflow) ─────────────────────────────────────────
musicxml = "1.1"

# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned (0.8.0-alpha.3, the rev architect
# v0.10.0 pins; bump this rev deliberately, it must stay in lockstep
# across every dioxus-* entry below AND the FTS fork tags of
# primitives/lucide/sdk (`fts-upstream-2026-11`), which pin the same rev).
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["lib"] }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
# Blitz native renderer — dioxus-native(-dom) moved into the dioxus repo
# on the 0.8 line; blitz-* are `=0.3.0-beta.4`, patched to the FTS fork
# below. Feature union of the wave-1 UI libs (prelude, system-fonts) and
# daw-reaper-dioxus (svg, autofocus, data-uri theme-skin PNGs); upstream
# dropped the `incremental` feature.
# `vello` — the compute-shader renderer — because dioxus-native's own
# default is `vello-hybrid`, which does much of its path work on the CPU.
# Hybrid exists for WebGL-class targets; on a desktop GPU it is what
# stands between the expression editor and its frame budget (35 fps at
# 5120x1440 with five notes on screen, where the whole scene was 69 draw
# commands and 0.04 ms to build — the cost was all in rasterising it).
#
# Both features can be on at once: the renderer is chosen by a `cfg_if`
# chain that tests `vello` first, so this wins over the default without
# having to turn defaults off and re-list them.
dioxus-native = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", features = ["prelude", "system-fonts", "svg", "autofocus", "data-uri", "vello"] }
lucide-dioxus = { git = "https://github.com/FastTrackStudios/lucide", tag = "fts-upstream-2026-11", features = ["all-icons"] }
anyrender_vello = "0.15"
# keyflow-ui / engraver renderer stack: the anyrender line Blitz paints
# with (0.14, from the blitz tag in [patch.crates-io]), anyrender_vello
# 0.15 / anyrender_vello_hybrid 0.11 from vendor, vello 0.11 and wgpu 30
# beneath them.
anyrender = "0.14"
anyrender_vello_hybrid = "0.11"
# vello_hybrid's successor; anyrender_vello_hybrid 0.11 paints into its Scene.
vello_gpu = "0.3"
vello_common = "0.3"
peniko = "0.6"
kurbo = "0.13"

# ── Serialization ─────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# ── Observability ─────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
regex = "1"

[patch.crates-io]
# Blitz from the FTS fork: tag `fts-upstream-2026-11`, DioxusLabs/blitz
# main plus the FTS work carried on top (focus-follows-pointerdown, touch
# as pointer events, layered compositing, the measure fix; the fork's
# FTS.md lists them). dioxus git pins `=0.3.0-beta.4`. The same tag
# architect pins (FastTrackStudios/architect#211), so one lock holds one
# Blitz. `anyrender` comes from the same tag: blitz-paint paints into it,
# and so does engraver's `ChartView` when an app (session) puts a chart in
# a Blitz canvas, so the two must be one crate.
blitz-dom = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-traits = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-paint = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-shell = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-net = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-html = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
anyrender = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
# The renderer and windowing crates architect patches from
# FastTrackStudios/vendor `v0.7.1` (each crate's UPSTREAM.md says what
# changed). Architect's iOS-only ones (winit-uikit, raw-window-metal) are
# not here: nothing in this workspace builds for iOS any more.
anyrender_vello = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
anyrender_vello_hybrid = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
wgpu-hal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }

# The same vendored phon, phon-jit, facet-core and vox-phon Task patches
# in (see its root manifest, and vendor's README, for each one's reason),
# so both ends of a vox call run one codec: upstream phon cannot derive a
# decoder for opaque scalars such as `Uuid` ("cannot derive phon from this
# type"), and upstream vox-phon rc.7 fails every real schema exchange with
# "schema decode consumed N of M bytes".
#
# phon and facet-core are SIBLING-CHECKOUT PATHS (../vendor, a clone of
# FastTrackStudios/vendor): their rc.7 forward-ports are committed there
# locally but not tagged yet. Replace each with `{ git =
# "https://github.com/FastTrackStudios/vendor", tag = … }` before this repo
# is pushed. phon-jit and vox-phon are already at published rc.7 tags.
phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.0" }
phon-jit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.3" }
facet-core = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.0" }
vox-phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.3.0" }

# The Dioxus crates architect takes from FastTrackStudios/vendor `v0.7.1`
# rather than the pinned rev (FastTrackStudios/architect#211): the
# simulator renderer, focus parked while busy, a dropped handler's owner
# not being a panic. Upstream renamed dioxus-core's vdom crate to
# `dioxus-vdom`.
[patch."https://github.com/DioxusLabs/dioxus"]
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
dioxus-native-dom = { git = "https://www.github.com/FastTrackStudios/vendor", rev = "25bf4bcdfd0b6acb268ca91a93bc8ff8da683a96" }
dioxus-vdom = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }

# One architect revision for the whole graph. Keyflow's own Architect
# entries are on the www spelling (see [workspace.dependencies]); this patch
# lifts the PLAIN spelling onto it. The one dependent on the plain spelling
# is daw v0.0.7, which pins architect v0.0.2 (same crate version 0.1.0, so
# the patch applies) and would otherwise put a second architect source in
# this repo's Cargo.lock. It only acts here: a git dependency's [patch] is
# ignored by its consumers, and studio gives daw its own copy. The www.
# host is a different source to cargo (GitHub redirects it), which is what
# lets it patch the plain one; a same-host patch is refused. Bump this revision
# with the pins above; drop the block once keyflow takes daw from studio.
[patch."https://github.com/FastTrackStudios/architect"]
architect = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-action-derive = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-derive = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-permissions = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-rpc-derive = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-story-core = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-story-macros = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-story-runtime = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-ui = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
# Reached both through the patched crates above and through the unpatched
# ones (architect-workspace, -shell): unpatched, each lands twice in the lock.
architect-theme = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-workspace-hack = { git = "https://www.github.com/FastTrackStudios/architect", tag = "v0.12.6" }

[workspace.lints.rust]
# Flipped from "allow" 2026-07-28 (task cleanup): the blanket allows are
# WHY ~30k lines of dead code accumulated silently. The task tree is
# warning-clean under these; legacy crates in other domains carry a
# crate-level `#![allow(dead_code, unused)]` marked "Lint debt" until
# their own burn-down.
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"
type_complexity = "allow"
# from the dissolved daw workspace
manual_clamp = "allow"
needless_range_loop = "allow"
not_unsafe_ptr_arg_deref = "allow"
only_used_in_recursion = "allow"
unnecessary_sort_by = "allow"
unusual_byte_groupings = "allow"
# from the dissolved session workspace
manual_c_str_literals = "allow"
branches_sharing_code = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
collapsible_if = "allow"
map_clone = "allow"
unnecessary_map_or = "allow"
if_same_then_else = "allow"
redundant_locals = "allow"
# from the dissolved keyflow workspace
large_enum_variant = "allow"
explicit_counter_loop = "allow"
manual_strip = "allow"
too_many_arguments = "allow"
double_must_use = "allow"
vec_init_then_push = "allow"
collapsible_match = "allow"
filter_next = "allow"

# ── Dev profile (carried from the dissolved signal workspace) ──────────
# The live rig runs from `fasttrackstudio --engine` (formerly signal-engine/signal-rigd): the vendored NAM C++
# core and the DSP crates are unusable at opt-level 0 (~10-50x slower,
# xruns), so dependencies build at release opt in dev while the thin
# app/UI workspace crates stay at light opt for fast rebuilds.
[profile.dev]
opt-level = 1

# Debuginfo discipline. Full DWARF was the single biggest cost in this
# tree: a `debug` test binary measured 1.62 GB, of which 1.59 GB (98%)
# was `.debug_*` sections — and the default linker copies all of it into
# every binary, every relink. Across ~6 worktrees that was ~1 TB of
# target/ and minutes of link time per build.
#
#   line-tables-only  keeps file:line in backtraces + profiler symbols
#                     (samply/perf still work); drops variable/type DWARF,
#                     so a *debugger* can't inspect locals.
#   unpacked          leaves the remaining DWARF in the .o files under
#                     deps/ instead of copying it into each artifact, so
#                     linking stops moving gigabytes around.
#
# Need a real debugger session? Build with `--profile dev-dbg` (below) —
# same codegen, full DWARF, and it uses a separate target dir so it never
# invalidates the fast dev artifacts.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Escape hatch: full DWARF for stepping in gdb/lldb. Everything else is
# identical to dev, and it uses a separate target dir so it never
# invalidates the fast dev artifacts.
[profile.dev-dbg]
inherits = "dev"
debug = 2
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 3
debug = false

# Temporary integration pins unify the renderer and IME forks across git
# dependencies. Replace these with released tags when those forks ship.
[patch."https://github.com/FastTrackStudios/blitz"]
blitz-dom = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-traits = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-paint = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-shell = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-net = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-html = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
anyrender = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }

[patch."https://github.com/FastTrackStudios/vendor"]
dioxus-native-dom = { git = "https://www.github.com/FastTrackStudios/vendor", rev = "25bf4bcdfd0b6acb268ca91a93bc8ff8da683a96" }
