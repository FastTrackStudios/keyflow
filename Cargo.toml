# keyflow — one root workspace.
#
# Split out of FastTrackStudios/session (see docs/split/KEYFLOW.md there).
# The notation domain: the Keyflow chart language (parser, formats, live
# follow, LSP, tree-sitter grammar) and Engraver, its layout/render engine.
#
# Layer position: architect/vendor -> daw -> **keyflow** -> session ->
# signal -> FastTrackStudio. Intra-repo dependencies are path deps in the
# table below; cross-repo dependencies are git deps pinned to a tag.
#
# `keyflow-proto` and `keyflow-syntax` deliberately live in the `daw`
# repo, not here: `expression-editor-core` (which `daw-reaper` hard-
# depends on) needs them, so they are foundation-layer. A wire contract
# plus a syntax parser below the domain is accepted, not a mistake.

[workspace]
resolver = "3"

members = [
    "crates/keyflow/cli",
    "crates/keyflow/keyflow",
    "crates/keyflow/keyflow-annotate",
    "crates/keyflow/keyflow-chordpro",
    "crates/keyflow/keyflow-daw-analysis",
    "crates/keyflow/keyflow-live",
    "crates/keyflow/keyflow-lsp",
    "crates/keyflow/keyflow-midi",
    "crates/keyflow/keyflow-musicxml",
    "crates/keyflow/keyflow-musx",
    "crates/keyflow/keyflow-orchestra",
    "crates/keyflow/keyflow-sync",
    "crates/keyflow/keyflow-text",
    "crates/keyflow/keyflow-ui",
    "crates/keyflow/tree-sitter-keyflow",
    "features/engraver/engraver",
    "features/engraver/proto",
    "features/engraver/score",
    "apps/web",
    "apps/mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/keyflow"

[workspace.dependencies]
# ── Internal — the notation domain, path declared ONCE here ───────────
# `keyflow` and `engraver` are the facades; keyflow-{text,midi,live,…}
# and engraver-proto are INTERNAL to the domain. Consumers outside this
# repo go through the two facades.
# Defaults OFF at the root: the facade's default pulls `engraver` (wgpu +
# vello), which the wasm site does not want (it renders through
# vello_hybrid) and the iOS build cannot take (printpdf's azul dep does not
# build for iOS). Every consumer names the features it needs.
keyflow = { path = "crates/keyflow/keyflow", default-features = false }
keyflow-text = { path = "crates/keyflow/keyflow-text" }
keyflow-chordpro = { path = "crates/keyflow/keyflow-chordpro" }
keyflow-midi = { path = "crates/keyflow/keyflow-midi" }
keyflow-live = { path = "crates/keyflow/keyflow-live" }
keyflow-musicxml = { path = "crates/keyflow/keyflow-musicxml" }
keyflow-musx = { path = "crates/keyflow/keyflow-musx" }
keyflow-annotate = { path = "crates/keyflow/keyflow-annotate" }
keyflow-orchestra = { path = "crates/keyflow/keyflow-orchestra" }
keyflow-sync = { path = "crates/keyflow/keyflow-sync" }
keyflow-daw-analysis = { path = "crates/keyflow/keyflow-daw-analysis" }
# Defaults OFF at the root: keyflow-ui's default is `web`, which enables
# `dioxus/desktop` — and that drags dioxus-desktop -> tungstenite ->
# native-tls -> openssl-sys into a wasm32 build, where openssl does not
# compile. Consumers name the surface they want (`web` / `native` /
# `wasm-graphics`).
keyflow-ui = { path = "crates/keyflow/keyflow-ui", default-features = false }
keyflow-cli = { path = "crates/keyflow/cli" }
keyflow-lsp = { path = "crates/keyflow/keyflow-lsp" }
tree-sitter-keyflow = { path = "crates/keyflow/tree-sitter-keyflow" }
engraver = { path = "features/engraver/engraver", default-features = false }
engraver-proto = { path = "features/engraver/proto", default-features = false }
engraver-score = { path = "features/engraver/score" }

# ── apps ──────────────────────────────────────────────────────────────
# The site. A workspace member so `cargo check --workspace` covers it on
# the host; the shipping build is `dx build --platform web`.
keyflow-web = { path = "apps/web" }
# The iOS app. A workspace member so its keyboard layout and chart library
# are checked and tested on the host; the shipping build is
# `dx build --platform ios` (see apps/mobile/ios/README.md).
keyflow-mobile = { path = "apps/mobile" }

# ── Cross-repo — tagged git deps ────────────────────────────────
# Defaults OFF at the root so lean consumers (probe-only scanners, the
# iOS-clean session-guide) don't drag the pack engine in; each consumer
# names the features it needs ("load" / "write" / "engine").
fts-sample = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2", default-features = false }

# ── daw domain (wave 2) ───────────────────────────────────────────────
# Facade crate — the only public API surface for the daw domain.
# daw-proto, daw-control, daw-standalone, dawfile-* are INTERNAL to the
# domain; consumers outside it go through the `daw` facade.
daw = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
daw-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
daw-module = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
dawfile-reaper = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
keyflow-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
keyflow-syntax = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }

# ── Facet reflection + vox RPC — the rc.5 fleet pins ──────────────────
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-json = { version = "0.50.0-rc.5" }
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }

# ── Architect framework — its own repo since the 2026-08 three-way split
# (FastTrackStudios/architect: the entity/RPC framework, the auth/crdt/
# permissions stack, architect-ui + architect-story, architect-telemetry).
# One tag pin shared by every entry so the whole framework moves together.
architect = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.0.2" }
# The Dioxus primitive library (was libs/ui/fts-ui, renamed on the split).
architect-ui = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.0.2" }

# ── MusicXML parsing (keyflow) ─────────────────────────────────────────
musicxml = "1.1"

# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned (0.8.0-alpha.0 + the blitz beta bump;
# bump this rev deliberately, it must stay in lockstep across every
# dioxus-* entry below AND the FTS fork branches of primitives/lumen/
# lucide/sdk, which pin the same rev).
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false, features = ["lib"] }
# Blitz native renderer — dioxus-native(-dom) moved into the dioxus repo
# on the 0.8 line; blitz-* come from crates.io (0.3.0-beta.1), matching
# dioxus git's own `=0.3.0-beta.1` pins. Feature union of the wave-1
# UI libs (prelude, system-fonts) and daw-reaper-dioxus (svg, autofocus,
# incremental, data-uri theme-skin PNGs).
# `vello` — the compute-shader renderer — because dioxus-native's own
# default is `vello-hybrid`, which does much of its path work on the CPU.
# Hybrid exists for WebGL-class targets; on a desktop GPU it is what
# stands between the expression editor and its frame budget (35 fps at
# 5120x1440 with five notes on screen, where the whole scene was 69 draw
# commands and 0.04 ms to build — the cost was all in rasterising it).
#
# Both features can be on at once: the renderer is chosen by a `cfg_if`
# chain that tests `vello` first, so this wins over the default without
# having to turn defaults off and re-list them.
dioxus-native = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", features = ["prelude", "system-fonts", "svg", "autofocus", "incremental", "data-uri", "vello"] }
lucide-dioxus = { git = "https://github.com/FastTrackStudios/lucide", branch = "main", features = ["all-icons"] }
anyrender_vello = "0.12"
# keyflow-ui / engraver-proto renderer stack (paired with dioxus-native
# 0.7.9 from crates.io). NOTE: keyflow-ui pins anyrender_vello 0.10.1 and
# dioxus-native 0.7.9 INLINE in its own manifest — they collide with the
# root's anyrender_vello 0.11 / blitz-git dioxus-native pins above, and
# root pins win in the workspace table, so the conflicting pair stays
# crate-local.
anyrender = "0.11"
anyrender_vello_hybrid = "0.8"
vello_hybrid = "0.0.9"
vello_common = "0.0.9"
peniko = "0.6"
kurbo = "0.13"

# ── Serialization ─────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# ── Observability ─────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
regex = "1"

[patch.crates-io]
# Blitz from the FTS fork (0.3.0-beta.1 line, upstream 02523b83 +
# fts-focus: focus-follows-pointerdown for all focusable content —
# upstream only click-focuses text inputs, leaving the editor's
# tabindex div unfocusable by mouse). dioxus git pins `=0.3.0-beta.1`.
# One rev across all blitz crates; the bump is gated on dioxus's next
# Blitz sync and moves as one step. See the session repo's manifest for
# the full history of why 02523b83 is the ceiling.
blitz-dom = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-traits = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-paint = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-shell = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-net = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-html = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }

# The session repo also patches `styx-format`, `phon` and `phon-jit` to
# FastTrackStudios/vendor. None of the three resolves into this graph —
# `vox` is pulled with default-features off — so they are deliberately
# absent rather than carried as unused-patch warnings. Re-add them from
# the session manifest if a crate here starts pulling the vox wire path.

[workspace.lints.rust]
# Flipped from "allow" 2026-07-28 (task cleanup): the blanket allows are
# WHY ~30k lines of dead code accumulated silently. The task tree is
# warning-clean under these; legacy crates in other domains carry a
# crate-level `#![allow(dead_code, unused)]` marked "Lint debt" until
# their own burn-down.
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"
type_complexity = "allow"
# from the dissolved daw workspace
manual_clamp = "allow"
needless_range_loop = "allow"
not_unsafe_ptr_arg_deref = "allow"
only_used_in_recursion = "allow"
unnecessary_sort_by = "allow"
unusual_byte_groupings = "allow"
# from the dissolved session workspace
manual_c_str_literals = "allow"
branches_sharing_code = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
collapsible_if = "allow"
map_clone = "allow"
unnecessary_map_or = "allow"
if_same_then_else = "allow"
redundant_locals = "allow"
# from the dissolved keyflow workspace
large_enum_variant = "allow"
explicit_counter_loop = "allow"
manual_strip = "allow"
too_many_arguments = "allow"
double_must_use = "allow"
vec_init_then_push = "allow"
collapsible_match = "allow"
filter_next = "allow"

# ── Dev profile (carried from the dissolved signal workspace) ──────────
# The live rig runs from `fasttrackstudio --engine` (formerly signal-engine/signal-rigd): the vendored NAM C++
# core and the DSP crates are unusable at opt-level 0 (~10-50x slower,
# xruns), so dependencies build at release opt in dev while the thin
# app/UI workspace crates stay at light opt for fast rebuilds.
[profile.dev]
opt-level = 1

# Debuginfo discipline. Full DWARF was the single biggest cost in this
# tree: a `debug` test binary measured 1.62 GB, of which 1.59 GB (98%)
# was `.debug_*` sections — and the default linker copies all of it into
# every binary, every relink. Across ~6 worktrees that was ~1 TB of
# target/ and minutes of link time per build.
#
#   line-tables-only  keeps file:line in backtraces + profiler symbols
#                     (samply/perf still work); drops variable/type DWARF,
#                     so a *debugger* can't inspect locals.
#   unpacked          leaves the remaining DWARF in the .o files under
#                     deps/ instead of copying it into each artifact, so
#                     linking stops moving gigabytes around.
#
# Need a real debugger session? Build with `--profile dev-dbg` (below) —
# same codegen, full DWARF, and it uses a separate target dir so it never
# invalidates the fast dev artifacts.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Escape hatch: full DWARF for stepping in gdb/lldb. Everything else is
# identical to dev, and it uses a separate target dir so it never
# invalidates the fast dev artifacts.
[profile.dev-dbg]
inherits = "dev"
debug = 2
split-debuginfo = "packed"

# dx web builds: native debuginfo in the wasm module blew past
# Chrome's 1 GiB WebAssembly module cap (1.14 GB observed). Wasm dev
# builds don't need it — strip it and dev bundles come back to a
# loadable size.
[profile.wasm-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

# Engraver lays out and rasterises a whole chart per keystroke, and in
# the browser that runs on the main thread. Dependencies build at
# opt-level 3 for wasm dev bundles (package overrides may not carry
# through `inherits`, so this is restated rather than inherited) — at
# opt-level 1 the live preview visibly lags typing.
[profile.wasm-dev.package."*"]
opt-level = 3
[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 3
debug = false

