# dx config for the Keyflow site. The web build is the product; the desktop
# launch exists only so `cargo check --workspace` and the tests are
# meaningful on the host.
[application]

[web.app]
title = "Keyflow"
base_path = "/"

[web.watcher]
# Deliberately NOT `../../docs/guides`.
#
# The guide is baked in by build.rs, so a published build does have to
# rebuild when a note changes — and it does: build.rs emits a
# `cargo:rerun-if-changed` per note, so any `cargo build` picks the edit
# up. What dx's watcher adds is triggering that rebuild automatically,
# and for the guide that is the wrong trade: a one-word fix costs four to
# five minutes.
#
# `just guide-preview` runs with `--features dev-guide` instead, where
# the server renders the vault at runtime and a watcher re-renders it on
# save. Listing the path here as well would fire the slow rebuild
# alongside the fast path, which is the whole thing we are avoiding.
watch_path = ["src", "assets"]

[bundle]
identifier = "app.fasttrackstudio.keyflow"
publisher = "FastTrackStudio"
