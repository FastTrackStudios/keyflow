[package]
name = "keyflow-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "keyflow.fasttrackstudio.app — the Keyflow landing page, live editor, and guide"

[dependencies]
# The language. `text` for the parser; the site never touches keyflow-text
# directly (facade rule).
keyflow = { workspace = true, features = ["text", "highlighting"] }

# The editor chrome + chart renderer. `wasm-graphics` is the WebGL2 path
# (vello_hybrid); it deliberately does NOT pull `web`, which would enable
# dioxus/desktop and break the wasm build. `pdf` adds vector PDF export —
# it is off by default because printpdf's azul dep does not build for iOS,
# but it does build for wasm32, so the site can hand out a real PDF
# rather than sending people to the print dialog.
# `wasm-graphics` is the WebGL2 path (vello_hybrid). Named for every target,
# not just wasm32: the ChartGraphics module is additionally gated on
# `target_arch = "wasm32"`, so a host build gets the editor chrome and skips
# the surface. Emphatically NOT `web` — that enables dioxus/desktop, which
# cannot build for wasm32.
keyflow-ui = { workspace = true, features = ["wasm-graphics", "pdf"] }

architect-ui = { workspace = true }

# The guide's knowledge graph. Pure and FS-free by design, so the graph is
# built in the browser from the same markdown the pages are rendered from.
view-knowledge-graph = { workspace = true }

# The guide is a vault, and it renders through the real editor in
# read-only mode rather than a bespoke markdown pass. That is what gives
# it `[[wikilink]]` navigation, folds and the ```kf fence family for free
# — the editor already understands all of it.
editor = { workspace = true }
editor-state = { workspace = true }
# Registers the chart renderer into editor-state's fence registry, so
# ```kf+ fences in the guide engrave instead of showing source.
editor-keyflow = { workspace = true }
# Keyflow *as a language* inside the editor: syntax decorations, IDE
# diagnostics, hover, and the resolved-chord overlays (1 -> C in the key
# of C). This is what makes the workbench a Keyflow editor rather than a
# textarea that happens to hold Keyflow.
editor-keyflow-lang = { workspace = true }
dioxus = { workspace = true, features = ["router"] }

# Chart-in-URL codec: deflate then base64url, so a whole chart fits in a
# link with no account and no server.
# Multi-page SVG export ships as a zip — one file per page, the shape the
# old site's ExportButton used.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

base64 = "0.22"
flate2 = "1"

# Canvas handle for ChartGraphics, and the popstate/clipboard bits.
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "DomRect",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlElement",
] }
# Pinned exactly, and low: `dx build` refuses to run when the crate version
# and the wasm-bindgen-cli in the dev shell disagree, and the CLI comes from
# the pinned nixpkgs (nix/modules/dx.nix). Bump this only together with that
# pin — a floating "0.2" silently resolves past the CLI and breaks the web
# build with "Incorrect wasm-bindgen-cli version".
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
kurbo = { workspace = true }

tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = "0.2"
# Not called directly. getrandom 0.3 needs BOTH the `wasm_js` cfg (set for
# the whole target in .cargo/config.toml) and this feature before it will
# build for wasm32; the cfg alone is a compile_error. It arrives here
# transitively (uuid, ahash), and only a direct dependency can turn the
# feature on.
getrandom = { version = "0.3", features = ["wasm_js"] }
# Debounce for the live preview. tokio's timer needs a reactor that does
# not exist in a browser.
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true
