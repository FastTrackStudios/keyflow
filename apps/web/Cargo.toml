[package]
name = "keyflow-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "keyflow.fasttrackstudio.app — the Keyflow landing page, live editor, and guide"

[dependencies]
# The language. `text` for the parser; the site never touches keyflow-text
# directly (facade rule).
keyflow = { workspace = true, features = ["text", "highlighting"] }

# The editor chrome + chart renderer. `wasm-graphics` is the WebGL2 path
# (vello_hybrid); it deliberately does NOT pull `web`, which would enable
# dioxus/desktop and break the wasm build. `pdf` adds vector PDF export —
# it is off by default because printpdf's azul dep does not build for iOS,
# but it does build for wasm32, so the site can hand out a real PDF
# rather than sending people to the print dialog.
# `wasm-graphics` is the WebGL2 path (vello_hybrid). Named for every target,
# not just wasm32: the ChartGraphics module is additionally gated on
# `target_arch = "wasm32"`, so a host build gets the editor chrome and skips
# the surface. Emphatically NOT `web` — that enables dioxus/desktop, which
# cannot build for wasm32.
keyflow-ui = { workspace = true, features = ["wasm-graphics", "pdf"] }

architect-ui = { workspace = true }

# Sign-in. Deliberately additive: the editor stays usable signed out
# (see the module docs in src/main.rs), and an account is for *keeping*
# charts, not for using the thing.
auth-http = { workspace = true }
auth-client = { workspace = true }

# The guide's knowledge graph. Pure and FS-free by design, so the graph is
# built in the browser from the same markdown the pages are rendered from.
view-knowledge-graph = { workspace = true }

# The guide is a vault, published as a static site: `ssg-build` renders
# the notes to HTML at build time — engraving their ```kf fences to
# inline SVG with the host engraver — and `ssg`/`ssg-ui` are the page
# model and the components that lay them out.
#
# This replaced rendering each note through the *editor* in read-only
# mode. That gave the guide wikilinks and engraved fences for free, and
# charged every reader the editor, its state machine, its decoration
# pipeline and a WebGL2 surface before a paragraph appeared.
#
# WITHOUT ssg-ui's `graph` feature — the local-graph rail is drawn with
# THIS repo's `view-knowledge-graph` (above) instead. Same crate, but
# task@main's copy reaches architect v0.7.1 where this repo is on
# v0.0.2, and taking both puts two reqwest majors in one wasm binary.
# See the note on the workspace entry.
ssg = { workspace = true }
ssg-ui = { workspace = true }

# Still here for the workbench (`/learn/:slug`), which is a real editor
# with a live chart — the interactive half of the guide, and the reason
# the editor is worth loading when someone actually asks for it.
editor = { workspace = true }
editor-state = { workspace = true }
# Registers the chart renderer into editor-state's fence registry, so
# ```kf+ fences in the workbench engrave instead of showing source.
editor-keyflow = { workspace = true }
# Keyflow *as a language* inside the editor: syntax decorations, IDE
# diagnostics, hover, and the resolved-chord overlays (1 -> C in the key
# of C). This is what makes the workbench a Keyflow editor rather than a
# textarea that happens to hold Keyflow.
editor-keyflow-lang = { workspace = true }
# The workspace dep carries no platform features (`default-features =
# false, features = ["lib"]` at the root); this crate's `default =
# ["web"]` turns on `dioxus/web` + `dioxus/launch`. That is
# dioxus-flake's packages/web pattern, and the same shape task uses.
#
# `dx serve` was getting away without it by injecting the platform
# itself, but a sandboxed `dx build` resolves offline and fell back to a
# feature set that wants `dioxus-fullstack` — a package the vendored
# dioxus git source does not carry, so the Nix image build died in
# resolution before reaching a compiler.
#
# `launch` sits here rather than on `web` because both halves of the
# build go through `LaunchBuilder` — the browser one to mount, the
# server one to render for `dx build --ssg`.
#
# `fullstack` is deliberately NOT here; it belongs to the `server`
# feature alone. See the note there.
dioxus = { workspace = true, features = ["router", "launch"] }

# Direct, only so the `web` feature can turn on `hydrate` — the client
# half of static generation, which adopts the pre-rendered DOM instead
# of throwing it away and re-rendering. `dioxus/fullstack` would enable
# it too, and cannot be used here; see the `server` feature.
dioxus-web = { workspace = true, optional = true }

# Chart-in-URL codec: deflate then base64url, so a whole chart fits in a
# link with no account and no server.
# Multi-page SVG export ships as a zip — one file per page, the shape the
# old site's ExportButton used.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

base64 = "0.22"
flate2 = "1"

# Canvas handle for ChartGraphics, and the popstate/clipboard bits.
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "DomRect",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlElement",
    "MediaQueryList",
    # Share dialog: the chart's own URL, and the clipboard to put it on.
    "Location",
    "Navigator",
    "Clipboard",
    # The live chart surface: a canvas, and the probe that decides
    # whether WebGL2 exists before one is mounted.
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    # Remembering what someone chose — see `prefs`.
    "Storage",
] }
# Pinned exactly, and low: `dx build` refuses to run when the crate version
# and the wasm-bindgen-cli in the dev shell disagree, and the CLI comes from
# the pinned nixpkgs (nix/modules/dx.nix). Bump this only together with that
# pin — a floating "0.2" silently resolves past the CLI and breaks the web
# build with "Incorrect wasm-bindgen-cli version".
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
kurbo = { workspace = true }

tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = "0.2"
# Not called directly. getrandom 0.3 needs BOTH the `wasm_js` cfg (set for
# the whole target in .cargo/config.toml) and this feature before it will
# build for wasm32; the cfg alone is a compile_error. It arrives here
# transitively (uuid, ahash), and only a direct dependency can turn the
# feature on.
getrandom = { version = "0.3", features = ["wasm_js"] }
# Debounce for the live preview. tokio's timer needs a reactor that does
# not exist in a browser.
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true

[build-dependencies]
# Reads docs/guides/keyflow and codegens the page table.
ssg-build = { workspace = true }
# The guide's markdown is rendered by the EDITOR, not by ssg's own pass,
# so a chapter looks the same published as it does being written —
# callouts, task lists and every fence the editor knows. See `build.rs`.
editor-state = { workspace = true }
# Registers the chart renderer into the editor's fence registry, so `kf`
# fences engrave during the build the same way they do while typing.
editor-keyflow = { workspace = true }
# Font subsetting for the guide's charts, so the page carries the glyphs
# it draws rather than every glyph the faces contain.
#
# `allsorts` rather than the obvious `subsetter`: that one REMOVES the
# cmap table (it targets PDF CID embedding, where the PDF supplies its
# own), and the engraved SVG addresses glyphs by character, so a browser
# needs a cmap to look them up in. allsorts generates one, and takes a
# `CmapTarget::Unicode` for exactly this case.
#
# `ttf-parser` maps the characters to glyph ids through the face's own
# cmap first. Both are already in this tree's lock.
allsorts = "0.16"
ttf-parser = "0.25"

# The engraver, on the host. `svg` is the no-GPU export path — the build
# script engraves every ```kf fence in the guide to inline SVG, which is
# why the site ships charts without shipping a chart renderer.
# `highlighting` for the chart source shown beside them.
keyflow = { workspace = true, features = ["text", "svg", "highlighting"] }

[features]
default = ["web"]
# `dioxus-web/hydrate` rather than `dioxus/fullstack`, which is the
# usual way to turn it on and cannot be used here.
#
# `dioxus/fullstack` carries the server-function *client* transport,
# which is reqwest 0.12. This tree already has reqwest 0.13, through
# iroh, through architect, through the knowledge graph — and two reqwest
# majors in one wasm binary is a hundred `duplicate symbol:
# intounderlyingsource_*` errors out of rust-lld, because each compiles
# its own copy of the wasm-streams glue. The site calls no server
# functions from the browser, so it needs none of that: what it needs is
# `hydrate`, and that only pulls `dioxus-fullstack-core`.
web = ["dioxus/web", "dep:dioxus-web", "dioxus-web/hydrate"]
# The server half, which exists only for the length of
# `dx build --ssg` — dx enables it for the server target by name, and
# never for the wasm one. reqwest 0.12 arriving here is harmless: this
# half is a host binary, and nothing links it against the browser's.
server = ["dioxus/server", "dioxus/fullstack"]
