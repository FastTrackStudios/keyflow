# The Architect pin bump, by the bot: when Architect releases a stable tag,
# a PR here moves every Architect pin to it (scripts/bump-architect.py, the
# same `just bump-architect vX.Y.Z` a person runs), and the bot merges it
# once CI is green on it, if the bump was mechanical.
#
#   prepare  (no secrets) resolves the tag (the input, or Architect's latest
#            stable release), stops when a person holds this release (a
#            closed bot PR for its branch, or one labelled `hold`), runs the
#            script, stages only the bump's paths, and hands the diff on.
#            Exit 3 (a followed pin moved, a big jump, a new git source)
#            still opens the PR, unmarked, with the reasons in its body.
#   open     (environment `pin-bump`) pushes `bump/architect-<tag>` (with
#            --force-with-lease, only over the bot's own commit), opens or
#            updates the PR, marked mechanical when it is.
#   land     (environment `pin-bump`) when CI finishes on a bump branch:
#            green on the bot's own head, still marked, not held, every file
#            on the allow-list, no new git source -> merges it now (squash,
#            pinned to that head; checked at merge time, so a later push
#            cannot ride along). Red -> one comment (edited in place) and the
#            marker removed: it never merges itself after that.
#
# Triggers: hourly (Architect's latest stable release), or by hand.
#
# A PATCH release (v0.12.4 -> v0.12.5) only keeps keyflow's own CI on the
# newest Architect: Studio does not wait for it (it patches keyflow's
# www-spelled pins to its own tag). A MINOR also sets the next keyflow
# version (`--version auto`), because Studio needs a keyflow release on it:
# after the merge, a person runs `just release-tag` (scripts/release-tag.sh).
#
# Tokens (the fts-forge App is broad, so each token is narrowed when it is
# minted, and lives in one step's environment only: never a file, argv, an
# output or an artifact; checkouts and reads use GITHUB_TOKEN):
#   open  FastTrackStudios/keyflow only: contents write (push the branch),
#         pull-requests write (open the PR).
#   land  FastTrackStudios/keyflow only: contents + pull-requests write (the
#         merge must be the App's, or main's CI would not run on it).
# scripts/check-token-mints.py (pr.yml) fails a mint outside that list.
#
# INERT until the owner sets, on this repo:
#   - variable ARCHITECT_BUMP = on
#   - variable FORGE_APP_ID = the fts-forge App's id
#   - environment `pin-bump`, deployment branches: main only, with the
#     environment variable BOT_ENVIRONMENT = pin-bump and the secret
#     PIN_BUMP_APP_KEY (the fts-forge App's key under a name nothing else
#     uses: a job outside its environment gets nothing, never an org secret)
# Without ARCHITECT_BUMP every job is skipped. Nothing here creates a tag.
name: bump-architect

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Architect release tag (vX.Y.Z); empty = Architect's latest stable release
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [CI, PR]
    types: [completed]
    branches: ["bump/architect-*"]

permissions: {}

concurrency:
  group: bump-architect-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 'open' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the bump
    if: ${{ vars.ARCHITECT_BUMP == 'on' && github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      branch: ${{ steps.state.outputs.branch }}
      pr: ${{ steps.state.outputs.pr }}
      head: ${{ steps.state.outputs.head }}
      changed: ${{ steps.bump.outputs.changed }}
      status: ${{ steps.bump.outputs.status }}
      kind: ${{ steps.bump.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Which tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            # `releases/latest` is the newest release that is neither a
            # draft nor a pre-release.
            tag="$(gh api repos/FastTrackStudios/architect/releases/latest --jq .tag_name)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a stable release tag (vX.Y.Z): no bump"
            exit 1
          fi
          pre="$(gh api "repos/FastTrackStudios/architect/releases/tags/$tag" --jq '.prerelease or .draft')"
          if [ "$pre" != false ]; then
            echo "::error::$tag is a draft or a pre-release on GitHub: no bump"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: toolchain
        run: rustup show active-toolchain
      - name: Restore cargo's dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-
      - name: Held, merged or open already?
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          branch="bump/architect-$TAG"
          prs="$(gh pr list --head "$branch" --state all --json number,state,author,headRefOid,labels \
            --jq '[.[] | select(.author.login == "app/fts-forge")]')"
          # A person's hold wins: closing the bump PR (or labelling it
          # `hold`) is THE way to hold one release; the bot never reopens it.
          if [ "$(jq '[.[] | select(.state != "OPEN")] | length' <<<"$prs")" != 0 ]; then
            echo "held or done: a closed or merged bot PR for $branch exists" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          open="$(jq -c '[.[] | select(.state == "OPEN")][0] // {}' <<<"$prs")"
          if jq -e '(.labels // []) | map(.name) | index("hold")' <<<"$open" >/dev/null; then
            echo "held: PR #$(jq .number <<<"$open") is labelled hold" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "go=true"
            echo "branch=$branch"
            echo "pr=$(jq -r '.number // empty' <<<"$open")"
            echo "head=$(jq -r '.headRefOid // empty' <<<"$open")"
          } >> "$GITHUB_OUTPUT"
      - name: just bump-architect
        id: bump
        if: ${{ steps.state.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PR: ${{ steps.state.outputs.pr }}
          PR_HEAD: ${{ steps.state.outputs.head }}
        run: |
          set -uo pipefail
          status=0
          cur="$(sed -n 's/^architect = .*tag = "\(v[^"]*\)".*/\1/p' Cargo.toml)"
          extra=()
          kind="patch"
          # A minor (vX.Y changes) needs a keyflow release: set its version.
          if [ "${cur%.*}" != "${TAG%.*}" ]; then kind="minor"; extra=(--version auto); fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          python3 scripts/bump-architect.py "$TAG" "${extra[@]}" --report "$RUNNER_TEMP/report.md" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::bump-architect refused $TAG (exit $status)"
            exit 1
          fi
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Only the paths a bump may touch.
          git add -- Cargo.toml '*/Cargo.toml' Cargo.lock AGENTS.md
          if [ -n "$(git status --porcelain --untracked-files=all | grep -v '^[AM]  ' || true)" ]; then
            echo "::error::the bump changed paths outside its allow-list:"; git status --porcelain; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bump"
          git diff --cached --binary > "$RUNNER_TEMP/bump/bump.patch"
          touch "$RUNNER_TEMP/report.md"
          cp "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/bump/report.md"
          if [ ! -s "$RUNNER_TEMP/bump/bump.patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already on $TAG: nothing to do" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # An open bot PR that already carries exactly this: no push, no churn.
          if [ -n "$PR_HEAD" ]; then
            git fetch -q --depth 1 origin "$PR_HEAD"
            if git diff --cached --quiet "$PR_HEAD" -- Cargo.toml '*/Cargo.toml' Cargo.lock AGENTS.md; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "PR #$PR already carries this bump: nothing to do" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.bump.outputs.changed == 'true' }}
        with:
          name: bump
          path: ${{ runner.temp }}/bump
          retention-days: 7

  open:
    name: Open the bump PR
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pin-bump
    permissions:
      contents: read
    steps:
      - name: Runs in the pin-bump environment, with its key
        env:
          BOT_ENVIRONMENT: ${{ vars.BOT_ENVIRONMENT }}
          KEY_SET: ${{ secrets.PIN_BUMP_APP_KEY != '' }}
        run: |
          if [ "${BOT_ENVIRONMENT:-}" != pin-bump ] || [ "$KEY_SET" != true ]; then
            echo "::error::this job must run in the 'pin-bump' environment (variable BOT_ENVIRONMENT=pin-bump, secret PIN_BUMP_APP_KEY); got '${BOT_ENVIRONMENT:-}', key set: $KEY_SET"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bump
          path: ${{ runner.temp }}/bump
      - name: fts-forge token (this repo only)
        id: forge
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.FORGE_APP_ID }}
          private-key: ${{ secrets.PIN_BUMP_APP_KEY }}
          owner: FastTrackStudios
          repositories: keyflow
          permission-contents: write
          permission-pull-requests: write
      - name: Push the branch, open the PR
        env:
          GH_TOKEN: ${{ steps.forge.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          STATUS: ${{ needs.prepare.outputs.status }}
          KIND: ${{ needs.prepare.outputs.kind }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          PR: ${{ needs.prepare.outputs.pr }}
          PR_HEAD: ${{ needs.prepare.outputs.head }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD" ]; then
            # Only over the bot's own commit: a branch a person pushed to is theirs.
            author="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD" --jq '.author.login // ""')"
            if [ "$author" != "fts-forge[bot]" ]; then
              echo "PR #$PR's head is $author's commit: left alone" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
          fi
          git apply --index "$RUNNER_TEMP/bump/bump.patch"
          title="build(deps): architect $TAG by tag"
          export GIT_AUTHOR_NAME="fts-forge[bot]" GIT_COMMITTER_NAME="fts-forge[bot]"
          export GIT_AUTHOR_EMAIL="345159799+fts-forge[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="345159799+fts-forge[bot]@users.noreply.github.com"
          git commit -qm "$title" -m "Every Architect pin (and the [patch] table) moves to $TAG: scripts/bump-architect.py $TAG, run by bump-architect.yml."
          # The token reaches git through GIT_CONFIG_* (this step's
          # environment), never argv or a file.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push -q --force-with-lease="refs/heads/$BRANCH:$PR_HEAD" "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          if [ "$STATUS" = 0 ]; then
            verdict="<!-- bump:mechanical -->"$'\n'"Mechanical: only the pins, the comments that name them and \`Cargo.lock\` changed. When \`CI\` is green on the bot's own head, the bot merges it (checking the files again then). If CI fails, the bump needs source changes and stays open for a person."
          else
            verdict="**Needs a person** (auto-merge is off):"$'\n\n'"$(cat "$RUNNER_TEMP/bump/report.md")"
          fi
          body="Moves every Architect pin to [$TAG](https://github.com/FastTrackStudios/architect/releases/tag/$TAG) (\`just bump-architect $TAG\`)."$'\n\n'"$verdict"$'\n\n'"To hold this release: close this PR, or label it \`hold\`. Opened by \`.github/workflows/bump-architect.yml\` (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          if [ "$KIND" = minor ]; then
            body="$body"$'\n\n'"**An Architect minor:** this sets the next keyflow version. Studio needs a keyflow release on it: after the merge, run \`just release-tag\`."
          else
            body="$body"$'\n\n'"An Architect patch release: Studio takes it without a keyflow release (it patches keyflow's www-spelled pins). This bump only keeps keyflow's own CI current; no tag needed."
          fi
          pr="$PR"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi
          echo "PR #$pr ($BRANCH): $([ "$STATUS" = 0 ] && echo 'merges when CI is green on this head' || echo 'needs a person')" >> "$GITHUB_STEP_SUMMARY"

  # When CI finishes on a bump branch. Green, on the PR's head (the bot's
  # own commit), still marked mechanical, not held, every file on the
  # allow-list, no new git source in Cargo.lock: the bot merges it NOW
  # (squash, pinned to that head). Checked at merge time, not when the PR
  # opened, so a later push cannot ride along. Red: one comment (edited in
  # place on later runs) and the marker removed, so it never merges itself.
  land:
    name: Merge a green mechanical bump
    if: >-
      vars.ARCHITECT_BUMP == 'on' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'bump/architect-') &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pin-bump
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Runs in the pin-bump environment, with its key
        env:
          BOT_ENVIRONMENT: ${{ vars.BOT_ENVIRONMENT }}
          KEY_SET: ${{ secrets.PIN_BUMP_APP_KEY != '' }}
        run: |
          if [ "${BOT_ENVIRONMENT:-}" != pin-bump ] || [ "$KEY_SET" != true ]; then
            echo "::error::this job must run in the 'pin-bump' environment (variable BOT_ENVIRONMENT=pin-bump, secret PIN_BUMP_APP_KEY); got '${BOT_ENVIRONMENT:-}', key set: $KEY_SET"
            exit 1
          fi
      - name: Green, marked, the bot's, on the allow-list?
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          echo "merge=false" >> "$GITHUB_OUTPUT"
          pr_json="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,headRefOid,author,body,labels \
            --jq '[.[] | select(.author.login == "app/fts-forge")][0] // empty')"
          [ -n "$pr_json" ] || { echo "no open bot PR from $BRANCH"; exit 0; }
          pr="$(jq -r .number <<<"$pr_json")"
          if [ "$CONCLUSION" != success ]; then
            failed="$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name)"')"
            note="<!-- bump:red -->"$'\n'"$WORKFLOW failed on this bump ($RUN_URL), so it is not mechanical: it will not merge itself and waits for a person (a source change on this branch, or a keyflow fix first)."$'\n\n'"Failed jobs:"$'\n'"${failed:-(none reported)}"
            cid="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq '[.[] | select(.body | startswith("<!-- bump:red -->"))][0].id // empty')"
            if [ -n "$cid" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -f body="$note" >/dev/null
            else gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "$note"; fi
            body="$(jq -r .body <<<"$pr_json")"
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --body "${body//<!-- bump:mechanical -->/}"
            exit 0
          fi
          [ "$WORKFLOW" = CI ] || { echo "$WORKFLOW passed; CI decides"; exit 0; }
          [ "$(jq -r .headRefOid <<<"$pr_json")" = "$HEAD_SHA" ] || { echo "CI ran on $HEAD_SHA, not the PR's head"; exit 0; }
          jq -e '.body | contains("<!-- bump:mechanical -->")' <<<"$pr_json" >/dev/null || { echo "not marked mechanical: a person merges it"; exit 0; }
          if jq -e '.labels | map(.name) | index("hold")' <<<"$pr_json" >/dev/null; then echo "labelled hold"; exit 0; fi
          author="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.author.login // ""')"
          [ "$author" = "fts-forge[bot]" ] || { echo "the head is $author's commit: a person merges it"; exit 0; }
          others="$(gh pr diff "$pr" -R "$GITHUB_REPOSITORY" --name-only | grep -vxE 'Cargo\.toml|.*/Cargo\.toml|Cargo\.lock|AGENTS\.md' || true)"
          [ -z "$others" ] || { echo "files outside the allow-list: $others"; exit 0; }
          repos() { sed -n 's|.*source = "git+https://\(www\.\)\{0,1\}\([^?#"]*\).*|\2|p' | tr '[:upper:]' '[:lower:]' | sort -u; }
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/Cargo.lock?ref=main" | repos > "$RUNNER_TEMP/main-repos"
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/Cargo.lock?ref=$HEAD_SHA" | repos > "$RUNNER_TEMP/pr-repos"
          added="$(comm -13 "$RUNNER_TEMP/main-repos" "$RUNNER_TEMP/pr-repos")"
          [ -z "$added" ] || { echo "new git sources in Cargo.lock: $added"; exit 0; }
          { echo "merge=true"; echo "pr=$pr"; } >> "$GITHUB_OUTPUT"
      - name: fts-forge token (this repo only)
        id: forge
        if: ${{ steps.judge.outputs.merge == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.FORGE_APP_ID }}
          private-key: ${{ secrets.PIN_BUMP_APP_KEY }}
          owner: FastTrackStudios
          repositories: keyflow
          permission-contents: write
          permission-pull-requests: write
      - name: Merge it (squash, on that head)
        if: ${{ steps.judge.outputs.merge == 'true' }}
        env:
          GH_TOKEN: ${{ steps.forge.outputs.token }}
          PR: ${{ steps.judge.outputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
