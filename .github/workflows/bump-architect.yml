# The Architect pin bump, by the bot: when Architect releases a stable tag,
# a PR here moves every Architect pin to it (scripts/bump-architect.py, the
# same `just bump-architect vX.Y.Z` a person runs) and merges itself once
# its checks are green, if the bump was mechanical.
#
#   prepare  (no secrets) resolves the tag (the input, or Architect's latest
#            stable release), runs the script, and hands the diff on as an
#            artifact. Exit 3 from the script (Architect moved a pin this
#            repo follows: the editor, dioxus, blitz) still opens the PR,
#            without auto-merge, with the reasons in its body.
#   open     (environment `pin-bump`) mints a short-lived fts-forge token
#            for THIS repo only (contents + pull-requests write), pushes
#            `bump/architect-<tag>`, opens or updates the PR, and turns on
#            auto-merge (squash) when the bump is mechanical. Branch
#            protection holds the merge until `PR checks` and `CI passed`.
#   explain  when CI fails on a bump branch: turns auto-merge off and says
#            which jobs failed. A failing bump stays open for a person.
#
# Triggers: Architect's release dispatches it (`gh workflow run
# bump-architect.yml -f tag=vX.Y.Z`, architect release.yml job `dispatch`);
# an hourly run catches a missed dispatch; by hand from the Actions tab.
#
# A PATCH release (v0.12.4 -> v0.12.5) only keeps keyflow's own CI on the
# newest Architect: Studio does not wait for it (it patches keyflow's
# www-spelled pins to its own tag). A MINOR also sets the next keyflow
# version (`--version auto`), because Studio needs a keyflow release on it:
# after the merge, a person runs `just release-tag` (scripts/release-tag.sh).
#
# Tokens (the fts-forge App is broad, so each token is narrowed when it is
# minted, and lives in one step's environment only: never a file, an
# output or an artifact; checkouts use the workflow's own GITHUB_TOKEN):
#   open     FastTrackStudios/keyflow only: contents write (push the
#            branch), pull-requests write (open the PR, arm auto-merge: the
#            merge it makes must be the App's, or main's CI would not run).
#   explain  no App token: GITHUB_TOKEN (pull-requests write, actions read).
# scripts/check-token-mints.py (pr.yml) fails a mint outside that list.
#
# INERT until the owner sets, on this repo:
#   - variable ARCHITECT_BUMP = on
#   - variable FORGE_APP_ID = the fts-forge App's id
#   - environment `pin-bump`, deployment branches: main only, with the
#     environment variable BOT_ENVIRONMENT = pin-bump and the secret
#     PIN_BUMP_APP_KEY (the fts-forge App's key under a name nothing else
#     uses: a job outside its environment gets nothing, never an org secret)
#   - Settings > General > "Allow auto-merge" (off today)
# Without ARCHITECT_BUMP every job is skipped. Nothing here creates a tag.
name: bump-architect

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Architect release tag (vX.Y.Z); empty = Architect's latest stable release
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [CI, PR]
    types: [completed]
    branches: ["bump/architect-*"]

permissions: {}

concurrency:
  group: bump-architect-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 'open' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the bump
    if: ${{ vars.ARCHITECT_BUMP == 'on' && github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      branch: ${{ steps.state.outputs.branch }}
      pr: ${{ steps.state.outputs.pr }}
      head: ${{ steps.state.outputs.head }}
      changed: ${{ steps.bump.outputs.changed }}
      status: ${{ steps.bump.outputs.status }}
      kind: ${{ steps.bump.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Which tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            # `releases/latest` is the newest release that is neither a
            # draft nor a pre-release.
            tag="$(gh api repos/FastTrackStudios/architect/releases/latest --jq .tag_name)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a stable release tag (vX.Y.Z): no bump"
            exit 1
          fi
          pre="$(gh api "repos/FastTrackStudios/architect/releases/tags/$tag" --jq '.prerelease or .draft')"
          if [ "$pre" != false ]; then
            echo "::error::$tag is a draft or a pre-release on GitHub: no bump"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: toolchain
        run: rustup show active-toolchain
      - name: Restore cargo's dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-
      - name: Held, merged or open already?
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          branch="bump/architect-$TAG"
          prs="$(gh pr list --head "$branch" --state all --json number,state,author,headRefOid,labels \
            --jq '[.[] | select(.author.login == "app/fts-forge")]')"
          # A person's hold wins: closing the bump PR (or labelling it
          # `hold`) is THE way to hold one release; the bot never reopens it.
          if [ "$(jq '[.[] | select(.state != "OPEN")] | length' <<<"$prs")" != 0 ]; then
            echo "held or done: a closed or merged bot PR for $branch exists" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          open="$(jq -c '[.[] | select(.state == "OPEN")][0] // {}' <<<"$prs")"
          if jq -e '(.labels // []) | map(.name) | index("hold")' <<<"$open" >/dev/null; then
            echo "held: PR #$(jq .number <<<"$open") is labelled hold" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "go=true"
            echo "branch=$branch"
            echo "pr=$(jq -r '.number // empty' <<<"$open")"
            echo "head=$(jq -r '.headRefOid // empty' <<<"$open")"
          } >> "$GITHUB_OUTPUT"
      - name: just bump-architect
        id: bump
        if: ${{ steps.state.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PR: ${{ steps.state.outputs.pr }}
          PR_HEAD: ${{ steps.state.outputs.head }}
        run: |
          set -uo pipefail
          status=0
          cur="$(sed -n 's/^architect = .*tag = "\(v[^"]*\)".*/\1/p' Cargo.toml)"
          extra=()
          kind="patch"
          # A minor (vX.Y changes) needs a keyflow release: set its version.
          if [ "${cur%.*}" != "${TAG%.*}" ]; then kind="minor"; extra=(--version auto); fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          python3 scripts/bump-architect.py "$TAG" "${extra[@]}" --report "$RUNNER_TEMP/report.md" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "::error::bump-architect refused $TAG (exit $status)"
            exit 1
          fi
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Only the paths a bump may touch.
          git add -- Cargo.toml '*/Cargo.toml' Cargo.lock AGENTS.md
          if [ -n "$(git status --porcelain --untracked-files=all | grep -v '^[AM]  ' || true)" ]; then
            echo "::error::the bump changed paths outside its allow-list:"; git status --porcelain; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bump"
          git diff --cached --binary > "$RUNNER_TEMP/bump/bump.patch"
          touch "$RUNNER_TEMP/report.md"
          cp "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/bump/report.md"
          if [ ! -s "$RUNNER_TEMP/bump/bump.patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already on $TAG: nothing to do" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # An open bot PR that already carries exactly this: no push, no churn.
          if [ -n "$PR_HEAD" ]; then
            git fetch -q --depth 1 origin "$PR_HEAD"
            if git diff --cached --quiet "$PR_HEAD" -- Cargo.toml '*/Cargo.toml' Cargo.lock AGENTS.md; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "PR #$PR already carries this bump: nothing to do" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.bump.outputs.changed == 'true' }}
        with:
          name: bump
          path: ${{ runner.temp }}/bump
          retention-days: 7

  open:
    name: Open the bump PR
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pin-bump
    permissions:
      contents: read
    steps:
      - name: Runs in the pin-bump environment, with its key
        env:
          BOT_ENVIRONMENT: ${{ vars.BOT_ENVIRONMENT }}
          KEY_SET: ${{ secrets.PIN_BUMP_APP_KEY != '' }}
        run: |
          if [ "${BOT_ENVIRONMENT:-}" != pin-bump ] || [ "$KEY_SET" != true ]; then
            echo "::error::this job must run in the 'pin-bump' environment (variable BOT_ENVIRONMENT=pin-bump, secret PIN_BUMP_APP_KEY); got '${BOT_ENVIRONMENT:-}', key set: $KEY_SET"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bump
          path: ${{ runner.temp }}/bump
      - name: fts-forge token (this repo only)
        id: forge
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.FORGE_APP_ID }}
          private-key: ${{ secrets.PIN_BUMP_APP_KEY }}
          owner: FastTrackStudios
          repositories: keyflow
          permission-contents: write
          permission-pull-requests: write
      - name: Push the branch, open the PR
        env:
          GH_TOKEN: ${{ steps.forge.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          STATUS: ${{ needs.prepare.outputs.status }}
          KIND: ${{ needs.prepare.outputs.kind }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          PR: ${{ needs.prepare.outputs.pr }}
          PR_HEAD: ${{ needs.prepare.outputs.head }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD" ]; then
            # Only over the bot's own commit: a branch a person pushed to is theirs.
            author="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD" --jq '.author.login // ""')"
            if [ "$author" != "fts-forge[bot]" ]; then
              echo "PR #$PR's head is $author's commit: left alone" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
          fi
          git apply --index "$RUNNER_TEMP/bump/bump.patch"
          title="build(deps): architect $TAG by tag"
          export GIT_AUTHOR_NAME="fts-forge[bot]" GIT_COMMITTER_NAME="fts-forge[bot]"
          export GIT_AUTHOR_EMAIL="345159799+fts-forge[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="345159799+fts-forge[bot]@users.noreply.github.com"
          git commit -qm "$title" -m "Every Architect pin (and the [patch] table) moves to $TAG: scripts/bump-architect.py $TAG, run by bump-architect.yml."
          git push -q --force-with-lease="refs/heads/$BRANCH:$PR_HEAD" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          if [ "$STATUS" = 0 ]; then
            verdict="Mechanical: only the pins, the comments that name them and \`Cargo.lock\` changed. Auto-merge is on: it merges once \`PR checks\` and \`CI passed\` are green. If CI fails, the bump needs source changes and stays open for a person."
          else
            verdict="**Needs a person** (auto-merge is off):"$'\n\n'"$(cat "$RUNNER_TEMP/bump/report.md")"
          fi
          body="Moves every Architect pin to [$TAG](https://github.com/FastTrackStudios/architect/releases/tag/$TAG) (\`just bump-architect $TAG\`)."$'\n\n'"$verdict"$'\n\n'"To hold this release: close this PR, or label it \`hold\`. Opened by \`.github/workflows/bump-architect.yml\` (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          if [ "$KIND" = minor ]; then
            body="$body"$'\n\n'"**An Architect minor:** this sets the next keyflow version. Studio needs a keyflow release on it: after the merge, run \`just release-tag\`."
          else
            body="$body"$'\n\n'"An Architect patch release: Studio takes it without a keyflow release (it patches keyflow's www-spelled pins). This bump only keeps keyflow's own CI current; no tag needed."
          fi
          pr="$PR"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi
          # Auto-merge only for a mechanical bump that touches only the
          # bump's paths, and never again once CI went red on it (explain's
          # comment): a person decides after that.
          others="$(gh pr diff "$pr" --name-only | grep -vxE 'Cargo\.toml|.*/Cargo\.toml|Cargo\.lock|AGENTS\.md' || true)"
          red="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq '[.[] | select(.body | startswith("<!-- bump:red -->"))] | length')"
          if [ "$STATUS" = 0 ] && [ -z "$others" ] && [ "$red" = 0 ]; then
            gh pr merge "$pr" --auto --squash --match-head-commit "$(git rev-parse HEAD)"
            echo "PR #$pr ($BRANCH): auto-merge on" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr merge "$pr" --disable-auto 2>/dev/null || true
            echo "PR #$pr ($BRANCH): needs a person${others:+ (files outside the allow-list: $others)}" >> "$GITHUB_STEP_SUMMARY"
          fi

  explain:
    name: A failed bump stays open
    if: >-
      vars.ARCHITECT_BUMP == 'on' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'bump/architect-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No App token: the workflow's own token can comment, turn auto-merge
    # off and read the failed run.
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Auto-merge off, say why (one comment, edited in place)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          pr="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,author --jq '.[] | select(.author.login == "app/fts-forge") | .number' | head -1)"
          [ -n "$pr" ] || { echo "no open bot PR from $BRANCH"; exit 0; }
          gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true
          failed="$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name)"')"
          note="<!-- bump:red -->"$'\n'"$WORKFLOW failed on this bump ($RUN_URL), so it is not mechanical: auto-merge is off and stays off; it waits for a person (a source change on this branch, or a keyflow fix first)."$'\n\n'"Failed jobs:"$'\n'"${failed:-(none reported)}"
          cid="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq '[.[] | select(.body | startswith("<!-- bump:red -->"))][0].id // empty')"
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -f body="$note" >/dev/null
          else
            gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "$note"
          fi
