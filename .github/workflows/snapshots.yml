# Visual regression CI for fts-story consumers.
#
# Runs `cargo test --release` inside the pinned Docker image so font
# rendering is byte-stable across machines. Triggers on push/PR; can be
# manually fired with `update_baselines: true` to refresh the committed
# PNGs and upload them as an artifact for review.

name: snapshots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Refresh baselines (requires manual review of artifact)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build snapshot image
        run: docker build -t fts-story-snapshots -f docker/Dockerfile .

      - name: Run snapshot tests
        env:
          UPDATE: ${{ inputs.update_baselines && '1' || '' }}
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            -e FTS_STORY_UPDATE_SNAPSHOTS="$UPDATE" \
            fts-story-snapshots \
            cargo test --release --workspace --features stories

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: |
            **/diff_output/**
            **/snapshots/**
          if-no-files-found: ignore

      - name: Upload refreshed baselines
        if: ${{ inputs.update_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-baselines
          path: |
            **/snapshots/**
          if-no-files-found: error
