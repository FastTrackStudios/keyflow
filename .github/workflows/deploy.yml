# Deploy — a pure-Nix OCI image pushed to the in-cluster registry, rolled
# out by ArgoCD + argocd-image-updater (digest strategy on the channel
# tag).
#
#   keyflow-web -> registry.starcommand.live:30050/keyflow-web
#
# Two jobs. The in-cluster registry is NOT reachable from GitHub-hosted
# runners, so `push` runs on the org's SELF-HOSTED runner (github-fts).
# That runner is registered on the FastTrackStudios org, so it reaches
# this repo; it does not reach personal-account repos, which is why
# starcommand's own deploy sits pending.
#
# `verify` polls a public URL for up to fifteen minutes, which needs
# nothing but curl — so it runs GitHub-hosted. There is one self-hosted
# runner for the whole org, and holding it to watch a website blocks
# every other repo's deploy behind the wait.
#
# GitHub Deployments: the `environment:` block registers a real
# Deployment, so runs appear under the repo's Environments tab with a
# link to the live site. It sits on `verify`, not on `push`, so "Active"
# means the cluster is SERVING this sha rather than that an image reached
# the registry.
#
# No path filtering. Every crate in this workspace can change what the
# site renders — the engraver draws it, keyflow-ui lays it out — so a
# path filter would either be wrong or be a list of everything.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-push; queue instead. A cancelled deploy can
# leave the registry holding a tag the cluster never rolled.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.starcommand.live:30050
  # Newer skopeo rejects the host's v1 registries.conf; every registry is
  # named explicitly below, so an empty (valid) config is enough.
  CONTAINERS_REGISTRIES_CONF: /dev/null

jobs:
  # The image build needs the self-hosted runner: the registry is
  # in-cluster and unreachable from GitHub-hosted ones.
  push:
    runs-on: [self-hosted, keyflow]
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push image
        run: |
          set -euo pipefail
          img=keyflow-web
          echo "── $img ──"
          # streamLayeredImage builds an EXECUTABLE that streams a
          # docker-archive to stdout — there is no tarball on disk to
          # copy, which is what keeps a ~60 MB bundle out of the store
          # twice.
          streamer="$(nix build .#${img}-image --no-link --print-out-paths)"
          "$streamer" | nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-tls-verify=false --dest-no-creds docker-archive:/dev/stdin \
            "docker://${REGISTRY}/${img}:latest"
          # Retag from the just-pushed :latest rather than re-streaming:
          # same digest by construction, and the image is built once.
          for tag in dev "${{ steps.tags.outputs.sha }}"; do
            nix run nixpkgs#skopeo -- --insecure-policy copy \
              --src-tls-verify=false --src-no-creds \
              --dest-tls-verify=false --dest-no-creds \
              "docker://${REGISTRY}/${img}:latest" \
              "docker://${REGISTRY}/${img}:${tag}"
          done

  # Polling a public URL for fifteen minutes needs nothing but curl, and
  # holding the org's ONE self-hosted runner to do it blocks every other
  # repo's deploy behind a wait. It runs on a GitHub-hosted runner, where
  # the queue is somebody else's problem.
  #
  # The `environment:` lives here rather than on `push`, because a green
  # Deployment should mean the cluster is SERVING this sha — not that an
  # image reached the registry.
  verify:
    needs: push
    runs-on: ubuntu-latest
    environment:
      name: keyflow-production
      url: https://keyflow.fasttrackstudio.app
    steps:
      # A green run must mean the cluster serves THIS commit. The bundle
      # reports the rev it was built from in version.json (written by
      # mkStaticSite), so this is the site answering, not the registry.
      - name: Verify live
        run: |
          url="https://keyflow.fasttrackstudio.app"
          want="${GITHUB_SHA}"
          echo "waiting for $url to serve $want"
          for i in $(seq 1 60); do
            got="$(curl -sf --max-time 10 "$url/version.json" \
              | sed -n 's/.*"rev":"\([^"]*\)".*/\1/p' || true)"
            echo "  poll $i: ${got:-?}"
            if [ "$got" = "$want" ]; then
              echo "LIVE: $url serves $want"
              exit 0
            fi
            sleep 15
          done
          echo "TIMED OUT: $url never served $want — check argocd-image-updater / rollouts"
          exit 1
