# keyflow — the one PR/push gate.
#
# Runs on the org's self-hosted runner (THEBATTLESHIP, label `nix-host` —
# see fasttrackstudio/.flake modules/selfhost/services/github-runner.nix):
# nix and the toolchain live on the host already, so there is no installer
# step and no rust-cache action — CARGO_TARGET_DIR points at the runner
# instance's systemd CacheDirectory instead, which persists across runs
# (and across restarts/reboots) the way a hosted-runner cache never could.
#
# Toolchain comes from the repo's devenv (devenv.yaml / devenv.nix, the
# devenv-fleet modules): every `run` step runs in `devenv shell`, the same
# nix rustc store path as a local shell, as architect's CI does. flake.nix
# is packaging only and has no dev shell.
#
# Deliberately simpler than the monorepo gate it replaces: that one drove
# `cargo rail plan` to pick affected crates out of a 238-member workspace.
# These workspaces are small enough to just build.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build + test
    runs-on: [self-hosted, keyflow]
    timeout-minutes: 60
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - name: Persistent target dir
        run: |
          dir="${CI_CACHE_DIR:-${CACHE_DIRECTORY:-$HOME/.cache}}/cargo-target"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
      - name: Manifests + lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo check --workspace
        run: cargo check --workspace
      # Task's and Studio's web apps build these crates for the browser.
      # `--workspace` above builds them for the host, which does not
      # compile the WebGL surface or any `cfg(target_arch = "wasm32")`
      # block — so a browser-only break sails through without this step.
      # The recipe holds the exact package/feature set.
      - name: cargo check (wasm)
        run: just wasm-check
      - name: cargo nextest
        run: cargo nextest run --workspace --no-fail-fast
